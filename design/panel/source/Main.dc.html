<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khung 240×240</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A7F96}a:hover{color:#FFF8E8}
</style>
</helmet>
<div style="position: relative; width: 240px; height: 240px; overflow: hidden; background: #000000; color: #FFF8E8; font-family: 'JetBrains Mono', monospace;">
<div style="position: absolute; left: 0; top: 0; width: 240px; height: 22px; box-sizing: border-box; padding: 0 6px; display: flex; align-items: center; justify-content: space-between;">
<span style="font-size: 12px; font-weight: 700; color: {{accent}};">TIÊU ĐỀ</span>
<span style="font-size: 11px; color: #8A7F96;">META</span>
</div>
<div style="position: absolute; left: 0; top: 22px; width: 240px; height: 1px; background: {{accent}};"></div>
<div style="position: absolute; left: 0; top: 24px; width: 240px; height: 196px; box-sizing: border-box; border: 1px dashed #34293F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
<span style="font-family: 'VT323', monospace; font-size: 44px; line-height: 1; color: #FFF8E8;">88%</span>
<span style="font-size: 11px; color: #8A7F96;">vùng nội dung y 24–219</span>
</div>
<div style="position: absolute; left: 0; top: 230px; width: 96px; height: 2px; background: {{accent}};"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5247","options":["#FF5247","#FFD23F","#8FE574","#54B6FF","#C385FF"]},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF5247' };
}
}
</script>
</body>
</html>
